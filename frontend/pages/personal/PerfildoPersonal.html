<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>
<body>
<main>
    <header class="container flex-between">
        <img
            src="assets/images/Logo academia neon verde (3).png"
            alt="Logo"
            height="50"
            width="50"
            class="logo-header"
        />
    </header>
    <div class="divider"></div>

    <div class="container text-center mt-2xl">
        <h2>Meu Perfil</h2>
    </div>

    <div class="container text-center mt-xl mb-xl">
        <img
            id="perfil-personal-imagem"
            src="assets/images/Aparecer.png"
            alt="Perfil"
            width="150"
            height="150"
            style="border-radius: 50%; object-fit: cover;"
        />
        <div class="flex-center gap-md mt-lg" style="justify-content: center;" data-route="editarPfrdoPersonal.html">
            <img src="assets/images/edit-row.png" alt="Editar" width="30" height="30" />
            <p style="margin: 0; cursor: pointer;">Editar</p>
        </div>
    </div>

    <div class="container">
        <div id="perfil-personal-status" class="status-message d-none"></div>

        <div class="form-group">
            <label class="form-label">Nome</label>
            <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <p id="perfil-personal-nome">Carregando...</p>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <p id="perfil-personal-email">Carregando...</p>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Certificados</label>
            <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <p id="perfil-personal-certificados">Carregando...</p>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Especialidade</label>
            <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <p id="perfil-personal-especialidade">Carregando...</p>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Genero</label>
            <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <p id="perfil-personal-genero">Carregando...</p>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Numero CREF</label>
            <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                <p id="perfil-personal-cref">Carregando...</p>
            </div>
        </div>

        <div class="text-center mt-xl mb-xl">
            <button id="perfil-personal-avaliacoes" class="btn btn-info btn-lg" type="button" style="background-color: #DAA520; margin-bottom: 10px;">⭐ Minhas Avaliações</button>
            <button id="perfil-personal-deletar" class="btn btn-danger btn-lg" type="button" style="background-color: #dc3545; margin-bottom: 10px;">Excluir Conta</button>
            <button id="perfil-personal-logout" class="btn btn-primary btn-lg" type="button">Sair</button>
        </div>
    </div>

    <div class="divider"></div>
    <nav class="nav-bottom">
        <div class="nav-icons">
            <div class="nav-item" data-route="meusAlunos.html">
                <img src="assets/images/PERSONAL.png" alt="Personal" width="40" height="40"/>
                <p>Alunos</p>
            </div>
            <div class="nav-item" data-route="TreinosdoPersonal.html">
                <img src="assets/images/TREINOS.png" alt="Treinos" width="40" height="40"/>
                <p>Treinos</p>
            </div>
            <div class="nav-item active">
                <img src="assets/images/PERFIL-COLORIDO.png" alt="Perfil" width="40" height="40"/>
                <p>Perfil</p>
            </div>
        </div>
    </nav>
</main>
<script type="module" src="js/pages/perfil-personal.js"></script>
</body>
</html>
