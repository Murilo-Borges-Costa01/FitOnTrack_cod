<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Selecionar Treino para Anexar</title>
    <link rel="stylesheet" href="assets/styles/styles.css" />
  </head>
  <body data-role="personal">
    <main>
      <header class="container flex-between">
        <button class="btn btn-secondary" type="button">
          <img src="assets/images/back.png" alt="Voltar" height="30" width="30" style="cursor: pointer;" data-action="back" />
        </button>
        <img
          src="assets/images/Logo academia neon verde (3).png"
          alt="Logo"
          height="50"
          width="50"
          class="logo-header"
        />
        <div style="width: 40px;"></div>
      </header>
      <div class="divider"></div>

      <div class="container mt-xl">
        <h2>Selecione um Treino</h2>
        <p style="color: var(--color-text-secondary); margin-top: var(--spacing-md);">
          Escolha qual treino deseja anexar a um aluno.
        </p>
      </div>

      <div class="container mt-xl">
        <div id="treinos-status" class="status-message d-none"></div>
        <div id="treinos-grid" class="grid"></div>
      </div>

      <div class="divider"></div>
      <nav class="nav-bottom">
        <div class="nav-icons">
          <div class="nav-item" data-route="meusAlunos.html">
            <img src="assets/images/PERSONAL.png" alt="Alunos" width="40" height="40"/>
            <p>Alunos</p>
          </div>
          <div class="nav-item" data-route="TreinosdoPersonal.html">
            <img src="assets/images/TREINOS.png" alt="Treinos" width="40" height="40"/>
            <p>Treinos</p>
          </div>
          <div class="nav-item" data-route="PerfildoPersonal.html">
            <img src="assets/images/PERFIL.png" alt="Perfil" width="40" height="40"/>
            <p>Perfil</p>
          </div>
        </div>
      </nav>
    </main>
    <script type="module" src="js/pages/selecionar-treino-anexar.js"></script>
  </body>
</html>
