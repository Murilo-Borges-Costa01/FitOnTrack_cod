<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Treino</title>
    <link rel="stylesheet" href="assets/styles/styles.css">
    <link rel="stylesheet" href="assets/vendor/sweetalert2/sweetalert2.min.css">
    <style>
        .exercicios-contador-wrapper {
            position: sticky;
            top: 50px;
            z-index: 10;
            text-align: center;
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-sm) 0;
            background: transparent;
        }

        #exercicios-contador {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 220px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(0, 212, 255, 0.45);
            background: rgba(0, 212, 255, 0.1);
            color: #5ee8ff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 0 0 rgba(0, 212, 255, 0);
            transition: all 0.25s ease;
        }

        #exercicios-contador.contador-ativo {
            color: #001015;
            background: linear-gradient(135deg, #00f0ff 0%, #00b7ff 100%);
            border-color: rgba(0, 240, 255, 0.9);
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.55);
            transform: translateY(-1px);
        }

        #exercicios-contador.contador-ativo::before {
            content: "●";
            font-size: 10px;
            color: #003240;
        }
    </style>
</head>
<body>
<main>
    <header class="container flex-between">
        <img
            src="assets/images/Logo academia neon verde (3).png"
            alt="Logo"
            height="50"
            width="50"
            class="logo-header"
        />
        <img src="assets/images/back.png" alt="Voltar" height="30" width="30" style="cursor: pointer;" data-action="back" />
    </header>
    <div class="divider"></div>

    <form id="criar-treino-form">
        <div class="container mt-xl">
            <h2 id="treino-form-title" class="text-center">Criar treino</h2>

            <div class="form-group text-center">
                <img id="treino-imagem-preview" src="assets/images/TREINOS.png" alt="Preview da imagem do treino" width="180" height="120" style="border-radius: var(--radius-md); object-fit: cover; margin-bottom: var(--spacing-md);" />
                <label class="form-label" for="treino-imagem">Imagem do treino</label>
                <input id="treino-imagem" type="file" class="form-control" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                <p class="mt-sm">Formatos aceitos: JPG e PNG, maximo de 5 MB.</p>
            </div>

            <div class="form-group">
                <h3 style="text-align: center;">De um titulo:</h3>
                <input id="treino-nome" type="text" class="form-control" placeholder="Nome do treino">
            </div>
            <div class="form-group">
                <h3 style="text-align: center;">Escolha o aluno:</h3>
                <select id="treino-aluno" class="form-control"></select>
            </div>
        </div>

        <div class="container mt-xl" style="padding-bottom: 150px;">
            <h3 style="text-align: center; margin-bottom: var(--spacing-lg);">Exercicios</h3>
            <div class="exercicios-contador-wrapper" aria-live="polite" aria-atomic="true">
                <small id="exercicios-contador">0 exercicios selecionados</small>
            </div>
            <div id="criar-treino-status" class="status-message d-none"></div>
            <div id="exercicios-grid" class="grid"></div>
        </div>

        <button id="criar-treino-submit" class="btn btn-primary btn-lg" type="submit" style="position: fixed; bottom: 90px; right: 20px; display: none; padding: 12px 24px; border-radius: 25px; border: none; background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%); box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4); transition: all 0.3s ease; z-index: 100; font-size: 14px; font-weight: 600; color: #000; white-space: nowrap;">SALVAR</button>
    </form>

    <div class="divider"></div>
    <nav class="nav-bottom">
        <div class="nav-icons">
            <div class="nav-item" data-route="meusAlunos.html">
                <img src="assets/images/PERSONAL.png" alt="Alunos" width="40" height="40"/>
                <p>Alunos</p>
            </div>
            <div class="nav-item active">
                <img src="assets/images/TREINOS-COLORIDO.png" alt="Treinos" width="40" height="40"/>
                <p>Treinos</p>
            </div>
            <div class="nav-item" data-route="PerfildoPersonal.html">
                <img src="assets/images/PERFIL.png" alt="Perfil" width="40" height="40"/>
                <p>Perfil</p>
            </div>
        </div>
    </nav>
</main>
<script src="assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>
<script type="module" src="js/pages/criar-treino.js"></script>
</body>
</html>
