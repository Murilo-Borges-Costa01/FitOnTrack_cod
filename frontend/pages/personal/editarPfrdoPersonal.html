<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Editar - Personal</title>
    <link rel="stylesheet" href="assets/styles/styles.css" />
  </head>
  <body>
    <main>
      <div class="container mt-lg mb-lg">
        <img src="assets/images/back.png" alt="Voltar" height="40" width="40" style="cursor: pointer" data-action="back" />
      </div>

      <div class="text-center mt-xl mb-xl"><h1>Editar personal</h1></div>

      <form class="container" id="editar-personal-form">
        <div class="form-group text-center">
          <img id="editar-personal-imagem-preview" src="frontend/assets/images/Aparecer.png" alt="Preview da imagem do personal" width="140" height="140" style="border-radius: 50%; object-fit: cover; margin-bottom: var(--spacing-md);" />
          <label class="form-label" for="editar-personal-imagem">Foto do personal</label>
          <input id="editar-personal-imagem" type="file" class="form-control" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
          <p class="mt-sm">Formatos aceitos: JPG e PNG, maximo de 5 MB.</p>
        </div>

        <div class="form-group">
          <label class="form-label">Nome</label>
          <input id="editar-personal-nome" type="text" class="form-control" placeholder="Digite seu nome" />
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="editar-personal-email" type="email" class="form-control" placeholder="Digite seu email" />
        </div>

        <div class="form-group">
          <label class="form-label">Numero do CREF</label>
          <input id="editar-personal-cref" type="text" class="form-control" placeholder="Ex.: CREF 000000-G/PE" />
        </div>

        <div class="form-group">
          <label class="form-label">Certificados</label>
          <textarea id="editar-personal-certificados" class="form-control" placeholder="Liste seus certificados e credenciais" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Especialidade</label>
          <input id="editar-personal-especialidade" type="text" class="form-control" placeholder="Ex: Musculação, Funcional, CrossFit, etc" />
        </div>

        <div class="form-group">
          <label class="form-label">Qual e o seu genero?</label>
          <select id="editar-personal-genero" class="form-control"></select>
        </div>

        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input id="editar-personal-senha" type="password" class="form-control" placeholder="Preencha apenas se quiser alterar" />
        </div>

        <div id="editar-personal-status" class="status-message d-none"></div>

        <div class="text-center mt-xl mb-xl">
          <button id="editar-personal-submit" class="btn btn-primary btn-lg" type="submit">Salvar alteracoes</button>
        </div>
      </form>
    </main>
    <script type="module" src="js/pages/editar-personal.js"></script>
  </body>
</html>
