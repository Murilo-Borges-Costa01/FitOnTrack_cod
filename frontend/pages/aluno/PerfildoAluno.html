<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Perfil do Aluno</title>
    <link rel="stylesheet" href="assets/styles/styles.css" />
  </head>
  <body>
    <main>
      <header class="container flex-between">
        <img
          src="assets/images/Logo academia neon verde (3).png"
          alt="Logo"
          height="50"
          width="50"
          class="logo-header"
        />
      </header>
      <div class="divider"></div>

      <div class="container text-center mt-2xl">
        <h2>Meu Perfil</h2>
      </div>

      <div class="container text-center mt-xl mb-xl">
        <img
          class="img-preview"
          id="perfil-aluno-imagem"
          src="../../assets/images/Aparecer.png"
          alt="Perfil"
          width="150"
          height="150"
          style="border-radius: 50%; object-fit: cover;"
        />
        <div class="flex-center gap-md mt-lg" style="justify-content: center;" data-route="edtPfdoAluno.html">
          <img src="assets/images/edit-row.png" alt="Editar" width="30" height="30" />
          <p style="margin: 0; cursor: pointer;">Editar</p>
        </div>
      </div>

      <div class="container">
        <div id="perfil-aluno-status" class="status-message d-none"></div>

        <div class="form-group">
          <label class="form-label">Nome</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-nome">Carregando...</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-email">Carregando...</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Altura</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-altura">Carregando...</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Massa</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-massa">Carregando...</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Problemas de Saude</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-saude">Carregando...</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Genero</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-genero">Carregando...</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Objetivo</label>
          <div style="padding: var(--spacing-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
            <p id="perfil-aluno-objetivo">Carregando...</p>
          </div>
        </div>

        <div class="text-center mt-xl mb-xl">
          <button id="perfil-aluno-deletar" class="btn btn-danger btn-lg" type="button" style="background-color: #dc3545; margin-bottom: 10px;">
            Deletar Conta
            <img src="assets/images/delete.png" alt="" height="20" width="20" style="display: none;" />
          </button>
          <button id="perfil-aluno-logout" class="btn btn-primary btn-lg" type="button">
            Sair
            <img src="assets/images/emergency-exit.png" alt="" height="20" width="20" />
          </button>
        </div>
      </div>

      <div class="divider"></div>
      <nav class="nav-bottom">
        <div class="nav-icons">
          <div class="nav-item" data-route="descriPersonal.html">
            <img src="assets/images/PERSONAL.png" alt="Personal" width="40" height="40"/>
            <p>Personal</p>
          </div>
          <div class="nav-item" data-route="treinos_aluno.html">
            <img src="assets/images/TREINOS.png" alt="Treinos" width="40" height="40"/>
            <p>Treinos</p>
          </div>
          <div class="nav-item active">
            <img src="assets/images/PERFIL-COLORIDO.png" alt="Perfil" width="40" height="40"/>
            <p>Perfil</p>
          </div>
        </div>
      </nav>
    </main>
    <script type="module" src="js/pages/perfil-aluno.js"></script>
  </body>
</html>
