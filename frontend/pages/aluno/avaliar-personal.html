<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Personal</title>
    <link rel="stylesheet" href="../../assets/styles/styles.css">
    <style>
        :root {
            --color-primary: rgb(0, 157, 223);
            --color-bg: #000000;
            --color-text: #ffffff;
            --color-text-secondary: #cccccc;
            --color-border: rgb(100, 100, 100);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .avaliacao-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #111111;
            border-radius: var(--radius-lg);
            box-shadow: 0 2px 10px rgba(0, 157, 223, 0.2);
        }

        .back-link {
            margin-bottom: 20px;
        }

        .back-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .avaliacao-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .avaliacao-header h2 {
            color: var(--color-text);
            margin-bottom: 10px;
        }

        .pessoal-info {
            background: #1a1a1a;
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--color-border);
        }

        .pessoal-info img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
        }

        .pessoal-nome {
            font-size: 18px;
            font-weight: bold;
            color: var(--color-text);
        }

        .pessoal-cref {
            color: var(--color-text-secondary);
            font-size: 14px;
        }

        .anonimo-aviso {
            background: #1a2a1a;
            border-left: 4px solid var(--color-primary);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: var(--radius-sm);
        }

        .anonimo-aviso .icon {
            color: var(--color-primary);
            font-weight: bold;
            margin-right: 10px;
        }

        .anonimo-aviso p {
            margin: 0;
            color: var(--color-text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--color-text);
        }

        .stars-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .star {
            font-size: 40px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .star:hover {
            opacity: 1;
        }

        .star.active {
            opacity: 1;
        }

        .estrelas-selecionadas {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: var(--color-primary);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: Arial, sans-serif;
            font-size: 14px;
            resize: vertical;
            background: #1a1a1a;
            color: var(--color-text);
        }

        textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 5px rgba(0, 157, 223, 0.3);
        }

        textarea::placeholder {
            color: var(--color-text-secondary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-enviar {
            background-color: var(--color-primary);
            color: var(--color-text);
        }

        .btn-enviar:hover {
            background-color: #0080b0;
        }

        .btn-cancelar {
            background-color: var(--color-border);
            color: var(--color-text);
        }

        .btn-cancelar:hover {
            background-color: #555555;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .status-message.loading {
            background-color: rgba(0, 157, 223, 0.2);
            color: var(--color-primary);
            display: block;
            border: 1px solid var(--color-primary);
        }

        .status-message.success {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            display: block;
            border: 1px solid #4CAF50;
        }

        .status-message.error {
            background-color: rgba(244, 67, 54, 0.2);
            color: #f44336;
            display: block;
            border: 1px solid #f44336;
        }

        .status-message.info {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            display: block;
            border: 1px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="avaliacao-container">
        <div class="back-link">
            <a href="javascript:history.back()">← Voltar</a>
        </div>

        <div class="avaliacao-header">
            <h2>Avaliar seu Personal</h2>
        </div>

        <div class="pessoal-info" id="pessoal-info">
            <div style="color: var(--color-text-secondary);">Carregando...</div>
        </div>

        <div class="anonimo-aviso">
            <span class="icon">🔒</span>
            <p><strong>Avaliação Anônima:</strong> Sua avaliação será totalmente anônima. O personal não saberá quem avaliou.</p>
        </div>

        <form id="form-avaliacao">
            <div class="form-group">
                <label>Como você avalia seu personal?</label>
                <div class="stars-container" id="stars-container">
                    <span class="star" data-value="1">⭐</span>
                    <span class="star" data-value="2">⭐</span>
                    <span class="star" data-value="3">⭐</span>
                    <span class="star" data-value="4">⭐</span>
                    <span class="star" data-value="5">⭐</span>
                </div>
                <div class="estrelas-selecionadas" id="estrelas-selecionadas">Selecione uma classificação</div>
                <input type="hidden" id="input-estrelas" name="estrelas" required>
            </div>

            <div class="form-group">
                <label for="comentario">Deixe um comentário (opcional)</label>
                <textarea id="comentario" name="comentario" placeholder="Compartilhe sua experiência com este personal..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-enviar">Enviar Avaliação</button>
                <button type="button" class="btn-cancelar" onclick="history.back()">Cancelar</button>
            </div>
        </form>

        <div class="status-message" id="status-message"></div>
    </div>

    <script type="module" src="../../js/pages/avaliar-personal.js"></script>
</body>
</html>
